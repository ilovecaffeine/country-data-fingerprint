# 1. PRIMARY DATA PROVIDERS & REPOSITORIES
providers:
  world_bank_wdi:
    name: "World Development Indicators (WDI)"
    publisher: "The World Bank Group"
    url: "https://databank.worldbank.org/source/world-development-indicators"
    license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
    access_date: "2025-08-17"
    citation_apa: "World Bank. (2025). World Development Indicators [Data set]. The World Bank Group."
    bibtex: |
      @misc{worldbank2025wdi,
        author = {{World Bank}},
        title = {World Development Indicators},
        year = {2025},
        publisher = {The World Bank Group},
        url = {https://databank.worldbank.org/source/world-development-indicators}
      }
  our_world_in_data:
      name: "Our World in Data (OWID)"
      publisher: "Global Change Data Lab"
      url: "https://ourworldindata.org"
      license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
      access_date: "2025-08-17"
      citation_apa: "Our World in Data. (2025). Our World in Data [Data set]. Global Change Data Lab."
      bibtex: |
        @misc{owid2025data,
          author = {{Our World in Data}},
          title = {Our World in Data},
          year = {2025},
          publisher = {Global Change Data Lab},
          url = {https://ourworldindata.org}
        }

