.CRI"]}, {"name": "BLZ", "imports": ["World.Africa.DJI", "World.Asia.TLS", "World.North America.HND", "World.Oceania.TON", "World.Africa.STP", "World.Oceania.FJI", "World.Africa.CPV"]}, {"name": "CAN", "imports": ["World.Oceania.AUS", "World.Oceania.NZL", "World.Europe.DEU", "World.Europe.GBR", "World.Asia.KOR"]}, {"name": "CRI", "imports": ["World.North America.BHS", "World.Africa.TUN", "World.South America.URY", "World.South America.CHL", "World.Asia.PSE", "World.Europe.PRT", "World.North America.PAN", "World.Africa.CPV"]}, {"name": "DOM", "imports": ["World.South America.PRY", "World.South America.PER", "World.North America.PAN"]}, {"name": "GTM", "imports": ["World.South America.ECU", "World.Asia.PHL", "World.South America.BOL", "World.North America.HND"]}, {"name": "HND", "imports": ["World.Asia.PHL", "World.Asia.KGZ", "World.Africa.MAR", "World.South America.PRY", "World.North America.SLV", "World.North America.GTM", "World.North America.NIC", "World.North America.BLZ"]}, {"name": "HTI", "imports": ["World.Asia.SYR", "World.Africa.KEN", "World.Africa.ZWE", "World.Africa.CMR"]}, {"name": "MEX", "imports": ["World.Asia.TUR", "World.Asia.CHN", "World.Asia.KAZ", "World.Asia.MYS", "World.South America.PER", "World.South America.ECU"]}, {"name": "NIC", "imports": ["World.South America.ECU", "World.South America.BOL", "World.North America.HND"]}, {"name": "PAN", "imports": ["World.South America.ECU", "World.North America.DOM", "World.South America.PER", "World.North America.CRI"]}, {"name": "SLV", "imports": ["World.Africa.MAR", "World.North America.HND", "World.Oceania.FJI", "World.South America.BOL", "World.Asia.BTN", "World.Africa.CPV"]}, {"name": "USA", "imports": ["World.Asia.JPN", "World.Europe.GBR", "World.Oceania.AUS"]}]}]};
        const width = 1000;
        const radius = width / 2 - 110;

        const colorScale = d3.scaleOrdinal(d3.schemeCategory10);

        const tree = d3.cluster().size([2 * Math.PI, radius]);

        const root = tree(bilink(d3.hierarchy(data)
            .sort((a, b) => d3.ascending(a.height, b.height) || d3.ascending(a.data.name, b.data.name))));

        const svg = d3.select("#chart").append("svg")
            .attr("width", width)
            .attr("height", width)
            .append("g")
            .attr("transform", `translate(${width/2},${width/2})`);

        const line = d3.lineRadial()
            .curve(d3.curveBundle.beta(0.85))
            .radius(d => d.y)
            .angle(d => d.x);

        // KHỬ TRÙNG LẶP DÂY VẼ (Chỉ giữ 1 đường nối duy nhất cho mỗi cặp)
        const allOutgoing = root.leaves().flatMap(leaf => leaf.outgoing);
        const uniqueLinksMap = new Map();
        allOutgoing.forEach(l => {
            const id1 = id(l[0]);
            const id2 = id(l[1]);
            const key = [id1, id2].sort().join("---");
            if (!uniqueLinksMap.has(key)) {
                uniqueLinksMap.set(key, l);
            }
        });
        const uniqueLinks = Array.from(uniqueLinksMap.values());

        // Vẽ dây nối SVG
        const link = svg.append("g")
          .selectAll("path")
          .data(uniqueLinks)
          .join("path")
            .attr("class", "link")
            .attr("d", ([i, o]) => line(i.path(o)))
            .each(function(d) { d.path = this; });

        // Tên các nước
        const node = svg.append("g")
          .selectAll("g")
          .data(root.leaves())
          .join("g")
            .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

        node.append("text")
            .attr("class", "node")
            .attr("dy", "0.31em")
            .attr("x", d => d.x < Math.PI ? 6 : -6)
            .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
            .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
            .attr("fill", d => colorScale(d.parent.data.name))
            .text(d => d.data.name)
            .each(function(d) { d.textNode = this; })
            .on("mouseover", overed)
            .on("mouseout", outed);

        function overed(event, d) {
            // 1. Làm mờ toàn bộ dây nối và tên nước khác
            link.style("stroke-opacity", 0.04).style("stroke-width", "1px");
            d3.selectAll(".node").style("opacity", 0.15);

            // 2. Highlight tên nước hiện tại
            d3.select(d.textNode)
                .style("opacity", 1)
                .attr("font-weight", "bold")
                .attr("font-size", "14px");

            // 3. Lọc tất cả các dây trong uniqueLinks có dính tới node d
            const activeLinks = uniqueLinks.filter(l => l[0] === d || l[1] === d);

            // 4. Highlight chính xác các dây đó và các nước hàng xóm
            activeLinks.forEach(l => {
                if (l.path) {
                    d3.select(l.path)
                        .style("stroke-opacity", 1)
                        .style("stroke-width", "2.8px")
                        .style("stroke", "#e74c3c")
                        .raise();
                }
                if (l[0] && l[0].textNode) {
                    d3.select(l[0].textNode)
                        .style("opacity", 1)
                        .attr("font-weight", "bold")
                        .attr("font-size", "12px");
                }
                if (l[1] && l[1].textNode) {
                    d3.select(l[1].textNode)
                        .style("opacity", 1)
                        .attr("font-weight", "bold")
                        .attr("font-size", "12px");
                }
            });
        }

        function outed(event, d) {
            // Khôi phục lại trạng thái ban đầu
            link.style("stroke-opacity", 0.25)
                .style("stroke-width", "1px")
                .style("stroke", "#7f8c8d");

            d3.selectAll(".node")
                .style("opacity", 1)
                .attr("font-weight", "normal")
                .attr("font-size", "10px");
        }

        function bilink(root) {
            const map = new Map(root.leaves().map(d => [id(d), d]));
            for (const leaf of root.leaves()) {
                leaf.node = leaf;
                leaf.incoming = [];
                leaf.outgoing = leaf.data.imports.map(i => [leaf, map.get(i)]).filter(d => d[1]);
            }
            for (const leaf of root.leaves()) {
                for (const o of leaf.outgoing) {
                    o[1].incoming.push(o);
                }
            }
            return root;
        }

        function id(node) {
            return `${node.parent ? id(node.parent) + "." : ""}${node.data.name}`;
        }
